# ===================================================================
# IT Service Desk Management System - Application Configuration
# ===================================================================

# Server Port (supports cloud dynamic $PORT e.g. Render, Railway, Cloud Run)
server.port=${PORT:8080}

# Application Name
spring.application.name=it-service-desk

# -------------------------------------------------------------------
# Active Profile
# 'dev': Zero-config H2 in-memory DB + H2 Web Console (default for local development)
# 'mysql': Production / local MySQL database
# -------------------------------------------------------------------
spring.profiles.active=dev
