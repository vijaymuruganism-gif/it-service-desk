# ===================================================================
# IT Service Desk Management System - Application Configuration
# ===================================================================

# Server Port
server.port=8080

# Application Identification
spring.application.name=it-service-desk

# -------------------------------------------------------------------
# Database Configuration (MySQL)
# SENSITIVE CREDENTIALS:
# We use environment variable interpolation ${ENV_VAR:defaultValue}.
# In production or CI/CD, set DB_URL, DB_USERNAME, and DB_PASSWORD.
# Never hardcode sensitive passwords into this file.
# -------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/servicedesk_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Configuration
# initialization-fail-timeout=-1 allows Spring Boot to start gracefully even
# if MySQL is temporarily offline during initial testing of HTTP endpoints.
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=10

# -------------------------------------------------------------------
# JPA / Hibernate Configuration
# -------------------------------------------------------------------
# Explicitly specifying the dialect allows Hibernate to initialize without
# querying database metadata during initial startup when MySQL might be offline.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
