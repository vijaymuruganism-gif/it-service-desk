name: Java CI/CD with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build, Test & Package
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up OpenJDK 17 (Eclipse Temurin)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Make Maven Wrapper Executable
      run: chmod +x mvnw

    - name: Run Automated Unit Tests
      run: ./mvnw clean test

    - name: Build Executable JAR Package
      run: ./mvnw package -DskipTests

    - name: Verify Docker Container Build
      run: docker build -t it-service-desk:latest .
